<section class="services" id="services">
  <div class="container">

    <div class="services-header">
      <span class="section-label reveal" scrollAnimate>{{ 'svc.label' | translate }}</span>
      <h2 class="section-title reveal delay-1" scrollAnimate>
        {{ 'svc.title1' | translate }} <em>{{ 'svc.title2' | translate }}</em><br>{{ 'svc.title3' | translate }}
      </h2>
      <div class="gold-line reveal delay-2" scrollAnimate></div>
    </div>

    <div class="services-grid">
      @for (service of services; track service.titleKey; let i = $index) {
        <div
          class="service-card reveal"
          scrollAnimate
          [style.transition-delay]="(i * 0.1) + 's'"
        >
          <h3 class="service-title">{{ service.titleKey | translate }}</h3>
          <p class="service-desc">{{ service.descKey | translate }}</p>
          <div class="service-line"></div>
        </div>
      }
    </div>

  </div>
</section>
