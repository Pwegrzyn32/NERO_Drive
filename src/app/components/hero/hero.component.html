<section class="hero" id="home">
  <!-- Background -->
  <div class="hero-bg">
    <div class="hero-overlay"></div>
    <picture>
      <source srcset="images/hero-bg.avif" type="image/avif" />
      <source srcset="images/hero-bg.webp" type="image/webp" />
      <img
        class="hero-img"
        src="images/hero-bg.jpg"
        alt="Alfa Romeo Giulia Veloce Q4 – NERO DRIVE"
        fetchpriority="high"
      />
    </picture>
  </div>

  <!-- Content -->
  <div class="hero-content">
    <h1 class="hero-title">
      <span class="hero-title-nero">NERO</span>
      <span class="hero-title-drive">DRIVE</span>
    </h1>

    <p class="hero-tagline">{{ 'hero.tagline' | translate }}</p>
  </div>

  <!-- Scroll indicator -->
  <div class="scroll-indicator">
    <span class="scroll-text">Scroll</span>
    <div class="scroll-track">
      <div class="scroll-thumb"></div>
    </div>
  </div>
</section>
